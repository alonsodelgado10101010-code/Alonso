name: Build Vintage Manager

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  NDK_VERSION: 27.2.12479018
  CARGO_TERM_COLOR: always

jobs:
  rust-tests:
    name: Núcleo Rust (cargo test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: vintage_core
      - name: cargo test
        working-directory: vintage_core
        run: cargo test

  android:
    name: APK release (Rust + Kotlin)
    needs: rust-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: vintage_core

      - name: Instalar cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Instalar NDK
        run: |
          if [ ! -d "${ANDROID_HOME}/ndk/${NDK_VERSION}" ]; then
            SDKM="$(ls -d ${ANDROID_HOME}/cmdline-tools/*/bin | sort -V | tail -1)/sdkmanager"
            yes | "$SDKM" --licenses > /dev/null || true
            "$SDKM" --install "ndk;${NDK_VERSION}"
          fi
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - uses: gradle/actions/setup-gradle@v4

      - name: Clave de firma permanente
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Faltan los secretos KEYSTORE_BASE64 y KEYSTORE_PASSWORD. Sin una clave fija, las actualizaciones borrarían los datos de la app. Agrégalos en Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/vintage-release.jks"
          echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/vintage-release.jks" >> "$GITHUB_ENV"
          echo "SIGNING_STORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "SIGNING_KEY_ALIAS=vintage" >> "$GITHUB_ENV"

      - name: Compilar (núcleo Rust + app) en un solo comando
        run: ./gradlew assembleRelease assembleDebugAndroidTest --stacktrace

      - name: Verificar firma
        run: |
          APKSIGNER=$(ls -d ${ANDROID_HOME}/build-tools/*/ | sort -V | tail -1)apksigner
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk | grep -i "certificate SHA-256"

      - name: Tamaño de libvintage_core.so (objetivo < 5 MB)
        run: |
          ls -la app/src/main/jniLibs/*/
          for f in app/src/main/jniLibs/*/libvintage_core.so; do
            size=$(stat -c%s "$f")
            echo "$f: $((size / 1024)) KB"
            if [ "$size" -gt 5242880 ]; then echo "::warning::$f supera 5 MB"; fi
          done

      - name: Preparar instalador
        run: cp app/build/outputs/apk/release/app-release.apk VintageManager.apk

      - uses: actions/upload-artifact@v4
        with:
          name: VintageManager-apk
          path: VintageManager.apk

      - name: Publicar instalador (Release)
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Vintage Manager 1.0.${{ github.run_number }}
          make_latest: true
          body: |
            Instalador para Android 8.0 o superior.
            Descarga **VintageManager.apk**, ábrelo en el teléfono y acepta "instalar apps de origen desconocido".
            Si ya tienes la app instalada, se actualiza **conservando todos tus datos**.
          files: VintageManager.apk

  instrumented-tests:
    name: Test instrumentado (emulador Android 14 x86_64)
    needs: android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: vintage_core

      - name: Instalar cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Instalar NDK
        run: |
          if [ ! -d "${ANDROID_HOME}/ndk/${NDK_VERSION}" ]; then
            SDKM="$(ls -d ${ANDROID_HOME}/cmdline-tools/*/bin | sort -V | tail -1)/sdkmanager"
            yes | "$SDKM" --licenses > /dev/null || true
            "$SDKM" --install "ndk;${NDK_VERSION}"
          fi
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar APK de prueba
        run: ./gradlew assembleDebug assembleDebugAndroidTest

      - name: Ejecutar en emulador
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: ./gradlew connectedDebugAndroidTest
