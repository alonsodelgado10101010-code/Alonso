[package]
name = "vintage_core"
version = "1.0.0"
edition = "2021"
description = "Núcleo de negocio de Vintage Manager: SQLite, motor tributario chileno, FEFO de prendas y alertas"
license = "MIT"
publish = false

[lib]
name = "vintage_core"
crate-type = ["cdylib", "lib"]

[[bin]]
# Generador de bindings Kotlin (se ejecuta en el host durante el build de Gradle)
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"
required-features = ["cli"]

[features]
default = []
cli = ["uniffi/cli"]

[dependencies]
uniffi = "=0.28.3"
rusqlite = { version = "0.32", features = ["bundled", "chrono"] }
rusqlite_migration = "1.3"
rust_decimal = { version = "1.36", default-features = false, features = ["std", "serde-str"] }
chrono = { version = "0.4", default-features = false, features = ["std", "serde"] }
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
qrcode = { version = "0.14", default-features = false }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
