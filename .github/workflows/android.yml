name: Build Vintage Manager

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NDK_VERSION: 27.2.12479018
  CARGO_TERM_COLOR: always

jobs:
  rust-tests:
    name: Núcleo Rust (cargo test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: vintage_core
      - name: cargo test
        working-directory: vintage_core
        run: cargo test

  android:
    name: APK release (Rust + Kotlin)
    needs: rust-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: vintage_core

      - name: Instalar cargo-ndk
        run: cargo install cargo-ndk --locked

      - uses: android-actions/setup-android@v3

      - name: Instalar NDK
        run: |
          sdkmanager --install "ndk;${NDK_VERSION}"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar (núcleo Rust + app) en un solo comando
        run: ./gradlew assembleRelease assembleDebugAndroidTest --stacktrace

      - name: Tamaño de libvintage_core.so (objetivo < 5 MB)
        run: |
          ls -la app/src/main/jniLibs/*/
          for f in app/src/main/jniLibs/*/libvintage_core.so; do
            size=$(stat -c%s "$f")
            echo "$f: $((size / 1024)) KB"
            if [ "$size" -gt 5242880 ]; then echo "::warning::$f supera 5 MB"; fi
          done

      - uses: actions/upload-artifact@v4
        with:
          name: vintage-manager-release-apk
          path: app/build/outputs/apk/release/*.apk

  instrumented-tests:
    name: Test instrumentado (emulador Android 14 x86_64)
    needs: android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: vintage_core

      - name: Instalar cargo-ndk
        run: cargo install cargo-ndk --locked

      - uses: android-actions/setup-android@v3

      - name: Instalar NDK
        run: |
          sdkmanager --install "ndk;${NDK_VERSION}"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar APK de prueba
        run: ./gradlew assembleDebug assembleDebugAndroidTest

      - name: Ejecutar en emulador
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: ./gradlew connectedDebugAndroidTest
