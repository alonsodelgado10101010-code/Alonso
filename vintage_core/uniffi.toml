[bindings.kotlin]
package_name = "cl.vintagemanager.core"
cdylib_name = "vintage_core"

[bindings.kotlin.custom_types.NaiveDate]
type_name = "LocalDate"
imports = ["java.time.LocalDate"]
into_custom = "LocalDate.parse({})"
from_custom = "{}.toString()"

[bindings.kotlin.custom_types.Decimal]
type_name = "BigDecimal"
imports = ["java.math.BigDecimal"]
into_custom = "BigDecimal({})"
from_custom = "{}.toPlainString()"
